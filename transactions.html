<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surplus Food Bridge - Transactions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="transactions">

    <nav class="navbar navbar-dark navbar-custom">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand">Surplus Food Bridge</span>
            <div class="d-flex align-items-center">
                <span id="navExtraLink" class="nav-extra-link"></span>
                <span id="welcomeText" class="navbar-welcome"></span>
                <button id="logoutBtn" class="btn btn-logout btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">

        <div class="dashboard-header d-flex flex-wrap justify-content-between align-items-end gap-3">
            <div>
                <h2>Transactions</h2>
                <p id="txSubtitle">Claims, posts and edits, newest first.</p>
            </div>
            <!-- Connection state of the live stream (see transactions.js) -->
            <span id="liveStatus" class="live-status live-connecting" role="status">
                <span class="live-dot"></span><span id="liveStatusText">Connecting</span>
            </span>
        </div>

        <div class="filter-bar">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="txTypeFilter">Type</label>
                    <select id="txTypeFilter" class="form-select">
                        <option value="">All types</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="txSearch">Search</label>
                    <input type="text" id="txSearch" class="form-control" placeholder="Person, listing or text" autocomplete="off">
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table admin-table align-middle">
                <thead>
                    <tr><th>Time</th><th>Type</th><th>Activity</th><th>Listing</th><th class="text-end">Quantity</th></tr>
                </thead>
                <tbody id="txBody"></tbody>
            </table>
        </div>
        <div class="text-center mt-3">
            <button type="button" id="txLoadMore" class="btn btn-outline-brown d-none">Load older transactions</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
