<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surplus Food Bridge - Supplier Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="supplier">

    <nav class="navbar navbar-dark navbar-custom">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand">Surplus Food Bridge</span>
            <div class="d-flex align-items-center">
                <span id="navExtraLink" class="nav-extra-link"></span>
                <span id="welcomeText" class="navbar-welcome"></span>
                <button id="logoutBtn" class="btn btn-logout btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">

        <div id="notFoundMessage" class="pending-gate d-none">
            <h3>Supplier Not Found</h3>
            <p>This donor profile does not exist or the link is incorrect.</p>
        </div>

        <div id="profileContent" class="d-none">

            <div class="profile-header">
                <h2 id="profileName"></h2>
                <p class="profile-meta" id="profileAddress"></p>
                <p class="profile-meta" id="profilePhone"></p>
                <div id="profileRating" class="mt-2"></div>
                <p class="mt-3 mb-0" id="profileDescription"></p>
                <div id="mapWrapper" class="map-container-small"></div>
            </div>

            <div class="row stats-bar g-3">
                <div class="col-6 col-md-3">
                    <div class="stat-tile">
                        <div class="stat-value" id="statPosted">0</div>
                        <div class="stat-label">Listings Posted</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-tile">
                        <div class="stat-value" id="statRescued">0</div>
                        <div class="stat-label">Units Rescued</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-tile">
                        <div class="stat-value" id="statCompleted">0</div>
                        <div class="stat-label">Completed Rescues</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="stat-tile">
                        <div class="stat-value" id="statNgoServed">0</div>
                        <div class="stat-label">NGOs Served</div>
                    </div>
                </div>
            </div>

            <!-- Only shown when the visitor is viewing their own profile -->
            <div id="editProfileCard" class="post-form-card d-none">
                <h5>Edit Your Profile</h5>
                <form id="editProfileForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="editPhone">Contact Phone</label>
                            <input type="tel" id="editPhone" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="editZone">Nearest Zone</label>
                            <select id="editZone" class="form-select" required></select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label" for="editAddress">Street Address / Landmark</label>
                        <input type="text" id="editAddress" class="form-control" required>
                    </div>
                    <div class="mt-3">
                        <label class="form-label" for="editDescription">Short Description</label>
                        <textarea id="editDescription" class="form-control" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary-brown mt-3">Save Changes</button>
                </form>
            </div>

            <h4 class="section-title">Active Listings</h4>
            <div class="row mb-5" id="profileListingsGrid"></div>

            <h4 class="section-title">Reviews From NGOs</h4>
            <div id="profileReviews"></div>

        </div>

    </div>

    <!-- Listing Detail Modal (shared markup, filled in by common.js) -->
    <div class="modal fade" id="listingDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Listing</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/common.js"></script>
    <script src="js/supplier.js"></script>
</body>
</html>
