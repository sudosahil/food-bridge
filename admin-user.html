<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surplus Food Bridge - Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<!-- Opened as admin-user.html?id=<user id> from the admin dashboard.
     admin-user.js fills in everything and wires the approve / suspend / delete buttons. -->
<body data-page="admin-user">

    <nav class="navbar navbar-dark navbar-custom">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand">Surplus Food Bridge</span>
            <div class="d-flex align-items-center">
                <span id="navExtraLink" class="nav-extra-link"></span>
                <span id="welcomeText" class="navbar-welcome"></span>
                <button id="logoutBtn" class="btn btn-logout btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">

        <div id="notFoundMessage" class="pending-gate d-none">
            <h3>Account not found</h3>
            <p>It may have been deleted. <a href="admin.html">Back to the admin dashboard</a></p>
        </div>

        <div id="profileContent" class="d-none">

            <div class="dashboard-header">
                <h2 id="userName"></h2>
                <p id="userSubtitle"></p>
                <div id="userChips" class="mt-3"></div>
            </div>

            <p id="actionError" class="text-danger fw-semibold small d-none"></p>

            <!-- ============ VERIFICATION + ACTIONS ============ -->
            <div class="verify-panel" id="verifyPanel">
                <div>
                    <h5 id="verifyTitle"></h5>
                    <p id="verifyText" class="mb-0"></p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="btn btn-primary-brown" id="approveBtn">Approve</button>
                    <button type="button" class="btn btn-outline-brown" id="unapproveBtn">Unapprove</button>
                    <button type="button" class="btn btn-outline-brown" id="suspendBtn">Suspend</button>
                    <button type="button" class="btn btn-outline-brown" id="deleteBtn">Delete</button>
                </div>
            </div>

            <!-- ============ DETAILS ============ -->
            <h4 class="section-title">Details</h4>
            <dl class="detail-grid detail-card" id="userDetails"></dl>

            <!-- ============ DONOR: LISTINGS / NGO: CLAIMS ============ -->
            <h4 class="section-title" id="itemsTitle"></h4>
            <div class="table-responsive mb-5">
                <table class="table admin-table align-middle">
                    <thead id="itemsHead"></thead>
                    <tbody id="itemsBody"></tbody>
                </table>
            </div>

            <h4 class="section-title" id="reviewsTitle"></h4>
            <div id="userReviews" class="mb-5"></div>

            <h4 class="section-title">Activity</h4>
            <div class="table-responsive">
                <table class="table admin-table align-middle">
                    <thead><tr><th>Time</th><th>Type</th><th>What happened</th></tr></thead>
                    <tbody id="activityBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin-user.js"></script>
</body>
</html>
