<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surplus Food Bridge - Donor Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="donor">

    <nav class="navbar navbar-dark navbar-custom">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand">Surplus Food Bridge</span>
            <div class="d-flex align-items-center">
                <span id="navExtraLink" class="nav-extra-link"></span>
                <span id="welcomeText" class="navbar-welcome"></span>
                <button id="logoutBtn" class="btn btn-logout btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container pb-5">

        <div class="dashboard-header">
            <h2>Donor Dashboard</h2>
            <p>Post surplus food and keep track of what your organization has donated.</p>
        </div>

        <div class="row stats-bar g-3">
            <div class="col-6 col-md-3">
                <div class="stat-tile">
                    <div class="stat-value" id="statTotalPosted">0</div>
                    <div class="stat-label">Total Posted</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-tile">
                    <div class="stat-value" id="statActive">0</div>
                    <div class="stat-label">Active Listings</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-tile">
                    <div class="stat-value" id="statRescued">0</div>
                    <div class="stat-label">Units Rescued</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-tile">
                    <div class="stat-value" id="statNgoServed">0</div>
                    <div class="stat-label">NGOs Served</div>
                </div>
            </div>
        </div>

        <div class="post-form-card">
            <h5>Post a New Food Listing</h5>
            <form id="foodForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="foodName">Food Item</label>
                        <input type="text" id="foodName" class="form-control" placeholder="e.g. Assorted Sandwiches" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="foodQuantity">Total Quantity</label>
                        <input type="number" id="foodQuantity" class="form-control" placeholder="e.g. 20" min="0.1" step="any" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="foodUnit">Unit</label>
                        <select id="foodUnit" class="form-select" required></select>
                    </div>
                </div>
                <div class="row g-3 mt-1">
                    <div class="col-md-4">
                        <label class="form-label" for="foodZone">Pickup Zone</label>
                        <select id="foodZone" class="form-select" required></select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label" for="foodAddressDetail">Pickup Instructions</label>
                        <input type="text" id="foodAddressDetail" class="form-control" placeholder="e.g. Rear entrance, ask for the kitchen manager" required>
                    </div>
                </div>
                <div class="row g-3 mt-1">
                    <div class="col-md-6">
                        <label class="form-label" for="foodPreparedAt">Prepared At</label>
                        <input type="datetime-local" id="foodPreparedAt" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="foodBestBefore">Pickup By (Best Before)</label>
                        <input type="datetime-local" id="foodBestBefore" class="form-control" required>
                    </div>
                </div>
                <p id="foodFormError" class="text-danger fw-semibold small d-none mt-3 mb-0"></p>
                <button type="submit" class="btn btn-primary-brown mt-3">Post Item</button>
            </form>
        </div>

        <h4 class="section-title">Active Donations</h4>
        <div class="row mb-5" id="donorActiveGrid"></div>

        <h4 class="section-title">Donation History</h4>
        <div class="row" id="donorHistoryGrid"></div>

    </div>

    <!-- Listing Detail Modal (shared markup, filled in by common.js) -->
    <div class="modal fade" id="listingDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Listing</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/donor.js"></script>
</body>
</html>
